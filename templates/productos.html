{% extends "layout.html" %}

{% block content %}
<div class="container-fluid">
    <h1>Productos</h1>
    <p>{{ mensaje }}</p>
</div>
<div id="carouselExampleControls"
class="carousel slide mi-carrusel"
data-ride="carousel">

<div class="carousel-inner">

<div class="carousel-item active">
<img src="{{ url_for('static', filename='img/productos/productos1.jpg') }}"
class="d-block w-100"
alt="Alfeñique">
</div>

<div class="carousel-item">
<img src="{{ url_for('static', filename='img/productos/productos2.jpg') }}"
class="d-block w-100"
alt="Velas">
</div>

<div class="carousel-item">
<img src="{{ url_for('static', filename='img/productos/productos3.jpg') }}"
class="d-block w-100"
alt="MUñecos de madera">
</div>

</div>

<a class="carousel-control-prev"
href="#carouselExampleControls"
role="button"
data-slide="prev">

<span class="carousel-control-prev-icon"
aria-hidden="true"></span>
</a>

<a class="carousel-control-next"
href="#carouselExampleControls"
role="button"
data-slide="next">

<span class="carousel-control-next-icon"
aria-hidden="true"></span>
</a>

</div>
{% endblock %}
